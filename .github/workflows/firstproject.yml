name: firstgroup5052948/FirstProject
on:
  push:
  workflow_dispatch:
concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.18
    timeout-minutes: 60
    env:
      VARIANT: community
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - run: 'echo "prepare: set up repo-local marker"'
    - run: mkdir -p ci
    - run: echo "prepared at $(date -u)" > ci/marker.txt
    - uses: actions/upload-artifact@v4.1.0
      if: success()
      with:
        name: "${{ github.job }}"
        retention-days: 1
        path: ci/marker.txt
  build-community:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: alpine:3.18
    if: success()
    timeout-minutes: 60
    env:
      VARIANT: community
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - uses: actions/download-artifact@v4.1.0
    - run: apk add --no-cache bash coreutils
    - run: echo "Starting build for variant=$VARIANT"
    - run: chmod +x scripts/ci-common.sh || true
    - run: "./scripts/ci-common.sh || true"
    - uses: actions/upload-artifact@v4.1.0
      if: success()
      with:
        name: "${{ github.job }}"
        retention-days: 1
        path: build/
  build-enterprise:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: alpine:3.18
    if: success()
    timeout-minutes: 60
    env:
      VARIANT: enterprise
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - uses: actions/download-artifact@v4.1.0
    - run: apk add --no-cache bash coreutils
    - run: echo "Starting build for variant=$VARIANT"
    - run: chmod +x scripts/ci-common.sh || true
    - run: "./scripts/ci-common.sh || true"
    - uses: actions/upload-artifact@v4.1.0
      if: success()
      with:
        name: "${{ github.job }}"
        retention-days: 1
        path: build/
  unit_test:
    needs:
    - build-community
    - build-enterprise
    runs-on: ubuntu-latest
    container:
      image: alpine:3.18
    if: success()
    timeout-minutes: 60
    env:
      VARIANT: community
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - uses: actions/download-artifact@v4.1.0
    - run: apk add --no-cache bash coreutils
    - run: 'echo "unit_test: inspect build artifacts if available"'
    - run: ls -la build || true
    - run: chmod +x scripts/ci-common.sh || true
    - run: "./scripts/ci-common.sh || true"
#     # 'artifacts.junit' was not transformed because there is no suitable equivalent in GitHub Actions
    - uses: actions/upload-artifact@v4.1.0
      if: success()
      with:
        name: "${{ github.job }}"
        retention-days: 1
        path: test-results/
  package_release:
    needs: unit_test
    runs-on: ubuntu-latest
    container:
      image: alpine:3.18
    if: success()
    timeout-minutes: 60
    env:
      VARIANT: community
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - uses: actions/download-artifact@v4.1.0
    - run: apk add --no-cache bash coreutils tar
    - run: echo "Packaging artifacts into repo-local tarball"
    - run: mkdir -p release
    - run: if [ -d build ]; then tar -czf "release/mock-release-${CI_COMMIT_SHORT_SHA:-local}.tgz" build || true; fi
    - run: ls -la release || true
    - uses: actions/upload-artifact@v4.1.0
      if: success()
      with:
        name: "${{ github.job }}"
        retention-days: 1
        path: release/
  deploy_production:
    needs: package_release
    runs-on: ubuntu-latest
    container:
      image: alpine:3.18
    if: # Unable to map conditional expression to GitHub Actions equivalent
#         ${{ github.ref }} == "main" || false
    environment:
      name: production
      url: http://example.local
    timeout-minutes: 60
    env:
      VARIANT: community
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - uses: actions/download-artifact@v4.1.0
    - run: apk add --no-cache bash coreutils
    - run: echo "DEPLOY (mock) - writing deploy artifacts locally"
    - run: chmod +x scripts/mock-deploy.sh || true
    - run: "./scripts/mock-deploy.sh deploy-output || true"
    - run: ls -la deploy-output || true
  notify:
    needs: deploy_production
    runs-on: ubuntu-latest
    container:
      image: alpine:3.18
    if: always()
    timeout-minutes: 60
    env:
      VARIANT: community
    steps:
    - uses: actions/checkout@v4.1.0
      with:
        fetch-depth: 20
        lfs: true
    - uses: actions/download-artifact@v4.1.0
    - run: 'echo "Notify: mock notification (no external calls)"'
    - run: echo "pipeline_id=${{ github.repository}}/${{ github.workflow }}"
    - run: 'echo "status: ${{ job.status }}"'
